<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main Page</title>
    <link rel="stylesheet" href="../../output.css" />
    <link
      rel="shortcut icon"
      href="/assets/images/javachip-favicon.ico"
      type="image/x-icon"
    />
    <script src="./index.js" defer></script>
    <script src="../../components/darkModeToggle.js" defer></script>
  </head>
  <body
    class="text-black transition-colors duration-300 bg-white dark:bg-black dark:text-white"
  >
    <nav class="bg-white border-gray-200 dark:bg-gray-900">
      <div
        class="flex flex-wrap items-center justify-between max-w-screen-xl p-4 mx-auto"
      >
        <div class="logo">
          <a href="/src/pages/main/index.html">
            <img
              src="/assets/icons/javachip-logo.svg"
              alt="The Javachip Logo"
              class="h-[81px] object-contain"
            />
          </a>
        </div>
        <div
          class="flex items-center space-x-1 md:order-2 md:space-x-0 rtl:space-x-reverse"
        >
          <div id="toggle" class="mr-2 toggle"></div>
          <button
            type="button"
            id="language-dropdown-btn"
            class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-gray-900 rounded-lg cursor-pointer dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 dark:hover:text-white"
          >
            <img
              class="w-5 h-5 rounded-full me-3"
              src="/assets/images/en-flag.png"
              alt="en"
            />
            English
          </button>
          <!-- Dropdown -->
          <div
            class="z-50 hidden my-4 text-base list-none bg-white divide-y divide-gray-100 rounded-lg shadow-sm dark:bg-gray-700"
            id="language-dropdown-menu"
          >
            <ul class="py-2 font-medium" role="none">
              <li>
                <a
                  href="#"
                  class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-600 dark:hover:text-white"
                  role="menuitem"
                >
                  <div class="inline-flex items-center">
                    <svg
                      aria-hidden="true"
                      class="h-3.5 w-3.5 rounded-full me-2"
                      xmlns="http://www.w3.org/2000/svg"
                      id="flag-icon-css-us"
                      viewBox="0 0 512 512"
                    >
                      <g fill-rule="evenodd">
                        <g stroke-width="1pt">
                          <path
                            fill="#bd3d44"
                            d="M0 0h247v10H0zm0 20h247v10H0zm0 20h247v10H0zm0 20h247v10H0zm0 20h247v10H0zm0 20h247v10H0zm0 20h247v10H0z"
                            transform="scale(3.9385)"
                          />
                          <path
                            fill="#fff"
                            d="M0 10h247v10H0zm0 20h247v10H0zm0 20h247v10H0zm0 20h247v10H0zm0 20h247v10H0zm0 20h247v10H0z"
                            transform="scale(3.9385)"
                          />
                        </g>
                        <path
                          fill="#192f5d"
                          d="M0 0h98.8v70H0z"
                          transform="scale(3.9385)"
                        />
                        <path
                          fill="#fff"
                          d="M8.2 3l1 2.8H12L9.7 7.5l.9 2.7-2.4-1.7L6 10.2l.9-2.7-2.4-1.7h3zm16.5 0l.9 2.8h2.9l-2.4 1.7 1 2.7-2.4-1.7-2.4 1.7 1-2.7-2.4-1.7h2.9zm16.5 0l.9 2.8H45l-2.4 1.7 1 2.7-2.4-1.7-2.4 1.7 1-2.7-2.4-1.7h2.9zm16.4 0l1 2.8h2.8l-2.3 1.7.9 2.7-2.4-1.7-2.3 1.7.9-2.7-2.4-1.7h3zm16.5 0l.9 2.8h2.9l-2.4 1.7 1 2.7L74 8.5l-2.3 1.7.9-2.7-2.4-1.7h2.9zm16.5 0l.9 2.8h2.9L92 7.5l1 2.7-2.4-1.7-2.4 1.7 1-2.7-2.4-1.7h2.9z"
                          transform="scale(3.9385)"
                        />
                      </g>
                    </svg>
                    English (US)
                  </div>
                </a>
              </li>
              <!-- Other language options remain the same -->
            </ul>
          </div>
          <button
            id="menu-btn"
            class="inline-flex items-center justify-center w-10 h-10 p-2 text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600"
          >
            <span class="sr-only">Open main menu</span>
            <img src="/assets/icons/hamburger-menu2.svg" alt="burger" />
          </button>
        </div>
        <div
          class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1"
          id="navbar-language"
        >
          <ul
            class="flex flex-col p-4 mt-4 font-medium border border-gray-100 rounded-lg md:p-0 bg-gray-50 md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-white dark:bg-gray-800 md:dark:bg-gray-900 dark:border-gray-700"
          >
            <li>
              <a
                href="/src/pages/main/index.html"
                class="block px-3 py-2 text-white bg-blue-700 rounded-sm md:bg-transparent md:text-blue-700 md:p-0 md:dark:text-blue-500"
                aria-current="page"
                >Home</a
              >
            </li>
            <li>
              <a
                href="/src/pages/portfolio/index.html"
                class="block px-3 py-2 text-gray-900 rounded-sm md:p-0 hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-[#2baea1] md:dark:hover:bg-transparent dark:border-gray-700"
                >Portfolio</a
              >
            </li>
            <li>
              <a
                href="/src/pages/about/index.html"
                class="block px-3 py-2 text-gray-900 rounded-sm md:p-0 hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-[#2baea1] md:dark:hover:bg-transparent dark:border-gray-700"
                >About</a
              >
            </li>
            <li>
              <a
                href="/src/pages/services/index.html"
                class="block px-3 py-2 text-gray-900 rounded-sm md:p-0 hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-[#2baea1] md:dark:hover:bg-transparent dark:border-gray-700"
                >Services</a
              >
            </li>
            <li>
              <a
                href="/src/pages/privacy/index.html"
                class="block px-3 py-2 text-gray-900 rounded-sm md:p-0 hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-[#2baea1] md:dark:hover:bg-transparent dark:border-gray-700"
                >Privacy Policy</a
              >
            </li>
            <li>
              <a
                href="/src/pages/faq/index.html"
                class="block px-3 py-2 text-gray-900 rounded-sm md:p-0 hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-[#2baea1] md:dark:hover:bg-transparent dark:border-gray-700"
                >FAQs</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section
      class="px-4 py-32 text-black transition-colors duration-300 bg-white dark:bg-black dark:text-white md:px-0"
    >
      <div
        class="grid items-center max-w-6xl grid-cols-1 gap-8 mx-auto md:grid-cols-2"
      >
        <div>
          <h1
            class="text-4xl font-extrabold tracking-tight text-gray-900 dark:text-gray-100 sm:text-5xl md:text-4xl lg:text-5xl xl:text-6xl"
          >
            <span class="block xl:inline">Innovation Starts with Code</span>
            <span class="block text-indigo-600 dark:text-indigo-400 xl:inline">
              Let’s Build Together.
            </span>
          </h1>
          <p
            class="mt-6 text-base text-gray-500 dark:text-gray-300 sm:max-w-md lg:text-xl md:max-w-3xl"
          >
            Empowering you to create engaging digital experiences that connect,
            inspire, and grow your brand.
          </p>
          <div class="mt-6">
            <a href="/src/pages/contact/index.html">
              <button
                class="px-6 py-3 text-2xl font-bold text-white bg-indigo-600 rounded-lg hover:bg-indigo-500 focus:outline-none dark:bg-indigo-400 dark:hover:bg-indigo-300"
              >
                Contact Us
              </button>
            </a>
          </div>
        </div>

        <div class="flex justify-center">
          <video
            class="object-cover w-full h-auto rounded-lg shadow-lg"
            autoplay
            loop
            muted
          >
            <source src="/assets/video/main-video.mp4" type="video/mp4" />
          </video>
        </div>
      </div>
    </section>

    <section
      class="relative container mx-auto p-4 text-black bg-gray-50 dark:bg-[black] dark:text-white"
    >
      <div
        class="border-[6px] rounded-[50%] h-[8vh] mt-6 absolute w-full border-t-[rgb(59,190,239)] border-r-transparent border-b-transparent border-l-transparent"
      ></div>
      <h1
        class="pt-16 text-4xl font-bold text-center lg:text-[5rem] md:text-6xl text-shadow-blueOutline"
      >
        Our Services
      </h1>
    </section>
